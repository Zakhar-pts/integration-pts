<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTS Cooperation Integration — Вхід</title><style>body{background:#090909;color:#f5efdd;font:16px system-ui;min-height:100vh;display:grid;place-items:center;margin:0}.box{background:#171717;border:1px solid #3a3325;border-radius:20px;padding:38px;width:min(420px,90vw);box-sizing:border-box}h1{font-size:35px}p{color:#aaa08c}input{box-sizing:border-box;width:100%;background:#101010;color:white;border:1px solid #514429;padding:15px;border-radius:10px;margin:8px 0 18px;font-size:16px}button{width:100%;padding:15px;background:#e5b82f;border:0;border-radius:10px;color:#15120c;font-weight:700;font-size:16px}.msg{padding:12px;background:#49314f;border-radius:9px}</style><div class="box"><img src="/static/pts-cooperation-original.png" alt="PTS Cooperation" style="display:block;width:100%;max-width:296px;height:auto"><h1 style="color:#e5b82f;font-size:24px">INTEGRATION</h1><p>Приватний кабінет інтеграцій</p>{% for msg in get_flashed_messages() %}<div class="msg">{{msg}}</div>{% endfor %}<form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label>Логін<input name="username" required autocomplete="username"></label><label>Пароль<input type="password" name="password" required autocomplete="current-password"></label><button>Увійти</button></form></div></html>
