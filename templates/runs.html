{% extends 'base.html' %}{% block content %}<h1>Журнал запусків</h1><div class="card"><table class="table"><tr><th>Час (UTC)</th><th>Сценарій</th><th>Статус</th><th>Повідомлення</th></tr>{% for r in items %}<tr><td>{{r.created}}</td><td>{{r.workflow.name if r.workflow else '—'}}</td><td><span class="tag {{r.status}}">{{r.status}}</span></td><td>{{r.message}}</td></tr>{% else %}<tr><td colspan="4">Запусків ще немає</td></tr>{% endfor %}</table></div>{% endblock %}
