{% extends 'base.html' %}{% block content %}<div class="row" style="justify-content:space-between"><h1>Мої інтеграції</h1><a class="btn" href="{{url_for('workflow_new')}}">＋ Нова інтеграція</a></div><div class="card"><table class="table"><tr><th>Сценарій</th><th>Дія</th><th>Статус</th><th></th></tr>{% for w in items %}<tr><td>{{w.name}}</td><td>{{w.action}}</td><td><span class="tag {{'success' if w.enabled else ''}}">{{'Активна' if w.enabled else 'Вимкнена'}}</span></td><td><a class="btn alt" href="{{url_for('workflow_detail',wid=w.id)}}">Відкрити</a></td></tr>{% else %}<tr><td colspan="4" class="muted">Створи першу інтеграцію</td></tr>{% endfor %}</table></div>{% endblock %}
